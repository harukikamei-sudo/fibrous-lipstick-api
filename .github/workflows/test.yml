name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system deps (libGL for opencv/skimage on headless Linux)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgl1

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx  # TestClient backend

      - name: Run test_km.py
        run: python test_km.py

      - name: Run test_lab_utils.py
        run: python test_lab_utils.py

      - name: Run test_bayesian.py
        run: python test_bayesian.py

      - name: Run test_scene_priors.py
        run: python test_scene_priors.py

      - name: Run test_recommend_v2.py
        run: python test_recommend_v2.py

      - name: Run test_v13_endpoints.py
        run: python test_v13_endpoints.py

      - name: Run test_v13_flow.py (E2E)
        run: python test_v13_flow.py

      - name: Run test_v14_flow.py (E2E)
        run: python test_v14_flow.py

  # A4 検証ハーネス(分析。ローカルは skimage の Gatekeeper ハングで動かないため CI で実行)。
  # workflow_dispatch 限定。canonical な定義は a4.yml(main マージ後に単独 dispatch 可)。
  a4:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system deps (libGL)
        run: sudo apt-get update -y && sudo apt-get install -y libgl1
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install matplotlib japanize-matplotlib
      - name: Run A4 validation harness
        run: python scripts/figures/make_a4_validation.py
      - name: Generate Kawano figures (協議用 PNG)
        run: python scripts/figures/make_kawano_figures.py
      - name: Upload figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a4-figures
          path: |
            docs/figures/a4_*.png
            scripts/figures/kawano_*.png
          if-no-files-found: warn
