# mypy の設定。pyproject.toml には置かない。
# 理由: Vercel の Python ビルドが pyproject.toml を依存の定義として読み、
#       [project] テーブルが無いと "No `project` table found" で失敗する。
#       このリポジトリは Python パッケージではなくアプリケーションで、
#       依存の正は requirements.txt に一本化している。
#       lint 設定のために pyproject.toml を置くと、そこが壊れる。

[mypy]
python_version = 3.11
ignore_missing_imports = True
exclude = ^hf_streamlit_space/

# Pydantic/FastAPI がインストール済みかどうかで BaseModel のコンストラクタ解析が
# 変わらないよう、third-party 側は missing import 時と同じ扱いに固定する。
# 外すと、依存ありの環境で偽陽性が 151 件出る（既定値を持つフィールドを必須と誤読する）。
[mypy-pydantic,pydantic.*,fastapi,fastapi.*,starlette,starlette.*]
follow_imports = skip
ignore_missing_imports = True

# scripts/figures/make_a4_validation.py: 既知の型エラー 24 件。
# A4 検証ハーネス内の混在型を後続タスクで整理する。
[mypy-scripts.figures.make_a4_validation,make_a4_validation]
ignore_errors = True

# test_recommend_v2.py: 既知の型エラー 15 件。
# 既存のスクリプト型テストの型注釈整備を後続タスクで行う。
[mypy-test_recommend_v2]
ignore_errors = True

# app.py: 既知の型エラー 12 件。
# FastAPI/Pydantic 境界の型整理を後続タスクで行う。
[mypy-app]
ignore_errors = True

# bayesian.py: 既知の型エラー 5 件。
# Gaussian 更新ロジックの型整理を後続タスクで行う。
[mypy-bayesian]
ignore_errors = True

# recommend_v2.py: 既知の型エラー 3 件。
# 推薦スコア計算の型整理を後続タスクで行う。
[mypy-recommend_v2]
ignore_errors = True

# ui_v13.py: 既知の型エラー 1 件。
# Streamlit UI 境界の型整理を後続タスクで行う。
[mypy-ui_v13]
ignore_errors = True

# scripts/figures/make_experience_figures.py: 既知の型エラー 1 件。
# 図表生成スクリプト内の型整理を後続タスクで行う。
[mypy-scripts.figures.make_experience_figures,make_experience_figures]
ignore_errors = True

# concierge_speech.py: 既知の型エラー 1 件。
# 音声応答ロジックの型整理を後続タスクで行う。
